<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speaking Lab - Tutor IA 🦇</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c20000;
            --bg: #fdfdfd;
            --text: #333;
            --glass-bg: rgba(194, 0, 0, 0.08);
            --glass-border: rgba(194, 0, 0, 0.15);
            --glass-blur: blur(12px);
            --chat-user: #f0f0f0;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #ffffff;
            --glass-bg: rgba(194, 0, 0, 0.2);
            --glass-border: rgba(194, 0, 0, 0.3);
            --glass-blur: blur(18px);
            --chat-user: #2d2d2d;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
            transition: 0.3s;
            overflow: hidden;
        }

        .theme-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 1.5rem;
            z-index: 100;
        }

        .header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .profile-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            object-fit: cover;
            transition: 0.3s;
        }

        .profile-img.thinking {
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(194, 0, 0, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(194, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(194, 0, 0, 0); }
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* Espaço extra no final para os botões não cobrirem o texto */
            padding-bottom: 180px; 
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word; /* Evita que o texto saia do balão */
            animation: messageSlide 0.3s ease-out;
            white-space: pre-wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tutor {
            align-self: flex-start;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom-left-radius: 4px;
        }

        .user {
            align-self: flex-end;
            background: var(--chat-user);
            border-bottom-right-radius: 4px;
            color: var(--text);
        }

        .user.interim { opacity: 0.5; font-style: italic; }

        .input-area {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 15px 0 30px 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            border-top: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.02);
            z-index: 10;
        }

        .mic-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(194, 0, 0, 0.3);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mic-btn.active {
            transform: scale(1.15);
            background: #333;
            animation: recording-glow 1s infinite alternate;
        }

        @keyframes recording-glow {
            from { box-shadow: 0 0 10px var(--primary); }
            to { box-shadow: 0 0 25px var(--primary); }
        }

        .verify-btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 30px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: 0.3s;
        }

        .verify-btn:active { transform: scale(0.95); }

        .status-text { font-size: 0.75rem; opacity: 0.6; font-weight: 400; }
    </style>
</head>
<body data-theme="light">

    <div class="theme-switch" id="themeToggle">🌔</div>

    <div class="header">
        <img src="https://images2.imgbox.com/c7/11/oVauFv1e_o.png" class="profile-img" id="avatar" alt="IA da Di">
        <h2 id="tutorName" style="margin: 8px 0 2px 0; font-size: 1.1rem; font-weight: 600;">IA da Di ☀️</h2>
        <p class="status-text">Practice your speaking</p>
    </div>

    <div id="chat-container">
        <div class="message tutor">
            Hi! I'm Di's AI, I'm here to help. <br>
            Tell me something about you. 
        </div>
    </div>

    <div class="input-area">
        <button class="mic-btn" id="micBtn">🎙️</button>
        <button class="verify-btn" id="verifyBtn">Check Grammar ✨</button>
        <div class="status-text" id="help-text">Tap to speak</div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyQFufk6NphokU1ciNCD7JRKQRAVNVhB9R3xwPV9q_Ljxs_TVcYvSJRCWQSlkJh0W09/exec";
        const body = document.body;
        const themeToggle = document.getElementById('themeToggle');
        const micBtn = document.getElementById('micBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const chatContainer = document.getElementById('chat-container');
        const avatar = document.getElementById('avatar');

        let recognition;
        let isRecording = false;
        let interimMessage;

        themeToggle.onclick = () => {
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeToggle.innerText = isDark ? "🌔" : "🦇";
            document.getElementById('tutorName').innerText = isDark ? "IA da Di ☀️" : "IA da Di 🦇";
        };

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interimTranscript += event.results[i][0].transcript;
                }

                if (finalTranscript) {
                    if (interimMessage) { interimMessage.remove(); interimMessage = null; }
                    addMessage(finalTranscript, 'user');
                    verifyBtn.style.display = 'block';
                } else if (interimTranscript) {
                    if (!interimMessage) {
                        interimMessage = addMessage(interimTranscript, 'user');
                        interimMessage.classList.add('interim');
                    } else { 
                        interimMessage.innerText = interimTranscript;
                        scrollToBottom();
                    }
                }
            };
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        micBtn.onclick = () => {
            if (!isRecording) {
                recognition.start();
                micBtn.classList.add('active');
                isRecording = true;
                verifyBtn.style.display = 'none';
            } else {
                recognition.stop();
                micBtn.classList.remove('active');
                isRecording = false;
            }
        };

        verifyBtn.onclick = async () => {
            const userMessages = document.querySelectorAll('.user:not(.interim)');
            if (userMessages.length === 0) return;
            const textToAnalyze = userMessages[userMessages.length - 1].innerText;

            avatar.classList.add('thinking');
            verifyBtn.style.display = 'none';
            document.getElementById('help-text').innerText = "thinking...";

            try {
                // Envio para o Google
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    body: JSON.stringify({ text: textToAnalyze })
                });

                // Busca a resposta após processamento
                setTimeout(async () => {
                    try {
                        const res = await fetch(GAS_URL + "?cb=" + Date.now());
                        const data = await res.json();
                        
                        avatar.classList.remove('thinking');
                        addMessage(data.reply, 'tutor');
                        document.getElementById('help-text').innerText = "Done! Tap to speak again.";
                    } catch (e) {
                        avatar.classList.remove('thinking');
                        addMessage("Keep going, you're doing great! ✨ (Tente falar mais uma frase)", 'tutor');
                    }
                }, 4000);

            } catch (err) {
                avatar.classList.remove('thinking');
                addMessage("Oops! The connection failed. 🦇", "tutor");
            }
        };
    </script>
</body>
</html>
