<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speaking Lab - Tutor IA 🦇</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c20000;
            --bg: #fdfdfd;
            --text: #333;
            --glass-bg: rgba(194, 0, 0, 0.08);
            --glass-border: rgba(194, 0, 0, 0.15);
            --glass-blur: blur(12px);
            --chat-user: #f0f0f0;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #ffffff;
            --glass-bg: rgba(194, 0, 0, 0.2);
            --glass-border: rgba(194, 0, 0, 0.3);
            --glass-blur: blur(18px);
            --chat-user: #2d2d2d;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
        }

        /* HEADER ULTRA-FINO E HORIZONTAL */
        .header {
            padding: 8px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            background: var(--bg);
            flex-shrink: 0;
            z-index: 100;
        }

        .profile-img {
            width: 42px; /* Menor e alinhada */
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
            margin-right: 12px;
        }

        .header-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .header-info h2 {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .header-info .status-text {
            margin: 0;
            font-size: 0.7rem;
            opacity: 0.6;
        }

        .theme-switch {
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
        }

        /* CONTAINER DE CHAT COM SCROLLBAR ATIVA */
        #chat-container {
            flex: 1;
            overflow-y: scroll; /* Força a barra de rolagem */
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 140px; /* Espaço para botões */
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        /* Estilização da barra de rolagem (Chrome/Safari) */
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: rgba(194, 0, 0, 0.3);
            border-radius: 10px;
        }

        .message {
            max-width: 85%;
            padding: 8px 14px;
            border-radius: 15px;
            font-size: 0.88rem;
            line-height: 1.3; /* Espaçamento entre linhas reduzido */
            word-wrap: break-word;
            animation: messageSlide 0.3s ease-out;
            white-space: pre-wrap;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tutor {
            align-self: flex-start;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom-left-radius: 4px;
        }

        .user {
            align-self: flex-end;
            background: var(--chat-user);
            border-bottom-right-radius: 4px;
        }

        .user.interim { opacity: 0.5; font-style: italic; }

        /* ÁREA DE BOTÕES COMPACTA */
        .input-area {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 10px 0 20px 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border-top: 1px solid rgba(0,0,0,0.05);
            z-index: 10;
        }

        .mic-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(194, 0, 0, 0.2);
        }

        .verify-btn {
            background: transparent;
            border: 1.5px solid var(--primary);
            color: var(--primary);
            padding: 5px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: none;
        }

        .status-msg { font-size: 0.65rem; opacity: 0.5; }
    </style>
</head>
<body data-theme="light">

    <div class="header">
        <img src="https://images2.imgbox.com/c7/11/oVauFv1e_o.png" class="profile-img" id="avatar" alt="IA da Di">
        <div class="header-info">
            <h2 id="tutorName">IA da Di ☀️</h2>
            <p class="status-text">Practice your speaking</p>
        </div>
        <div class="theme-switch" id="themeToggle">🌔</div>
    </div>

    <div id="chat-container">
        <div class="message tutor">Hi! I'm Di's AI, I'm here to help. <br>Tell me something about you.</div>
    </div>

    <div class="input-area">
        <button class="mic-btn" id="micBtn">🎙️</button>
        <button class="verify-btn" id="verifyBtn">Check Grammar ✨</button>
        <div class="status-msg" id="help-text">Tap to speak</div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyQFufk6NphokU1ciNCD7JRKQRAVNVhB9R3xwPV9q_Ljxs_TVcYvSJRCWQSlkJh0W09/exec";
        const body = document.body;
        const themeToggle = document.getElementById('themeToggle');
        const micBtn = document.getElementById('micBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const chatContainer = document.getElementById('chat-container');
        const avatar = document.getElementById('avatar');

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        themeToggle.onclick = () => {
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeToggle.innerText = isDark ? "🌔" : "🦇";
            document.getElementById('tutorName').innerText = isDark ? "IA da Di ☀️" : "IA da Di 🦇";
        };

        if ('webkitSpeechRecognition' in window) {
            var recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interimTranscript += event.results[i][0].transcript;
                }
                if (finalTranscript) {
                    addMessage(finalTranscript, 'user');
                    verifyBtn.style.display = 'block';
                }
                scrollToBottom();
            };
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        let isRecording = false;
        micBtn.onclick = () => {
            if (!isRecording) {
                recognition.start();
                micBtn.style.background = "#333";
                isRecording = true;
            } else {
                recognition.stop();
                micBtn.style.background = "var(--primary)";
                isRecording = false;
            }
        };

        verifyBtn.onclick = async () => {
            const userMessages = document.querySelectorAll('.user');
            const textToAnalyze = userMessages[userMessages.length - 1].innerText;
            
            avatar.style.boxShadow = "0 0 10px var(--primary)";
            document.getElementById('help-text').innerText = "thinking...";

            try {
                await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ text: textToAnalyze }) });
                
                setTimeout(async () => {
                    const res = await fetch(GAS_URL + "?cb=" + Date.now());
                    const data = await res.json();
                    avatar.style.boxShadow = "none";
                    addMessage(data.reply, 'tutor');
                    document.getElementById('help-text').innerText = "Done!";
                }, 4000);
            } catch (e) {
                avatar.style.boxShadow = "none";
                addMessage("Keep going, you're doing great! ✨", 'tutor');
            }
        };
    </script>
</body>
</html>
