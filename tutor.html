<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Teste de Microfone 🎙️</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #1a1a1a; color: white; }
        #textOutput { width: 80%; height: 100px; margin: 20px; padding: 10px; border-radius: 10px; }
        .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: none; cursor: pointer; font-size: 2rem; background: #6c757d; color: white; }
        .mic-btn.listening { background: #c20000; box-shadow: 0 0 15px #c20000; }
    </style>
</head>
<body>
    <textarea id="textOutput" placeholder="O que você falar aparecerá aqui..."></textarea>
    <button id="micBtn" class="mic-btn">🎙️</button>
    <p id="status">Clique no microfone e fale</p>

    <script>
        const micBtn = document.getElementById('micBtn');
        const textOutput = document.getElementById('textOutput');
        const status = document.getElementById('status');

        // Verifica se o navegador suporta a API [cite: 85]
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.lang = 'en-US'; // [cite: 86]
            recognition.continuous = false;
            recognition.interimResults = false;
           
recognition.interimResults = true;

recognition.onresult = (event) => {
    let result = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
        result += event.results[i][0].transcript;
    }
    textOutput.value = result;
};

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                status.innerText = "Ouvindo...";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                textOutput.value = transcript;
                status.innerText = "Reconhecido!";
            };

            recognition.onerror = (event) => {
                status.innerText = "Erro: " + event.error;
                micBtn.classList.remove('listening');
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                if (status.innerText === "Ouvindo...") {
                    status.innerText = "Parou de ouvir.";
                }
            };

            micBtn.onclick = () => {
                recognition.start();
            };
        } else {
            status.innerText = "Navegador não suporta Speech API.";
        }
    </script>
</body>
</html>
