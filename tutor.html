<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Speaking Studio 🎙️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .instruction { font-size: 0.85rem; text-align: center; margin-bottom: 15px; color: #ccc; }
        
        /* Agora é apenas para leitura */
        #textOutput { width: 100%; background: #2a2a2a; border: 1px solid #444; color: white; padding: 15px; border-radius: 10px; min-height: 120px; margin-bottom: 20px; font-family: 'Poppins'; outline: none; resize: none; font-size: 1rem; }
        
        .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: none; background: #6c757d; color: white; font-size: 2rem; cursor: pointer; transition: 0.3s; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; }
        .mic-btn.listening { background: #c20000; box-shadow: 0 0 20px #c20000; }
        
        .btn-group { display: flex; gap: 10px; width: 100%; }
        
        .submit-btn { background: #c20000; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-weight: 600; cursor: pointer; flex: 2; transition: 0.2s; }
        .submit-btn:hover { background: #e60000; }

        .retry-btn { background: #444; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-weight: 400; cursor: pointer; flex: 1; transition: 0.2s; font-size: 0.85rem; }
        .retry-btn:hover { background: #555; }
    </style>
</head>
<body>
    <div class="instruction">
        Confira sua fala abaixo. Se estiver correto, envie. <br>Caso contrário, clique em "Tentar de Novo" e grave novamente.
    </div>
    
    <textarea id="textOutput" readonly placeholder="Sua voz aparecerá aqui..."></textarea>
    
    <button id="micBtn" class="mic-btn">🎙️</button>
    
    <div class="btn-group">
        <button id="btnRetry" class="retry-btn">Recomeçar</button>
        <button id="submitBtn" class="submit-btn">Enviar e Verificar</button>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const textOutput = document.getElementById('textOutput');
        const submitBtn = document.getElementById('submitBtn');
        const btnRetry = document.getElementById('btnRetry');

        let isListening = false;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
            };

            recognition.onresult = (event) => {
                let currentTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentTranscript += event.results[i][0].transcript;
                }
                textOutput.value += (textOutput.value ? " " : "") + currentTranscript;
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
            };

            micBtn.onclick = () => {
                if (!isListening) {
                    recognition.start();
                } else {
                    recognition.stop();
                }
            };
        } else {
            alert("Navegador não suporta reconhecimento de voz.");
        }

        // Função para limpar o texto e tentar de novo
        btnRetry.onclick = () => {
            textOutput.value = "";
        };

        submitBtn.onclick = () => {
            const finalText = textOutput.value.trim();
            if (window.opener) {
                window.opener.postMessage({
                    type: 'SPEECH_DATA',
                    text: finalText
                }, "*"); 
                window.close(); 
            } else {
                alert("Por favor, abra o estúdio através do Speaking Lab.");
            }
        };
    </script>
</body>
</html>
