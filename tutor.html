<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speaking Lab - Diandra 🎙️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Definido como Padrão o Modo Escuro que você preferiu */
            --red-glass: rgba(130, 0, 0, 0.7);
            --white-glass: rgba(0, 0, 0, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            --bg-overlay: rgba(0, 0, 0, 0.6); 
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #4A7729;
            color: var(--text-color);
            position: relative;
        }

        /* Fundo Windows XP com Blur */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://i.postimg.cc/GpBzk6PK/Windowsxp.webp') no-repeat center center fixed;
            background-size: cover;
            filter: blur(6px); 
            transform: scale(1.1);
            z-index: -2;
        }

        /* Overlay Escuro Fixo */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-overlay);
            z-index: -1;
        }

        .lab-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            z-index: 1;
        }

        .bubble {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-shadow: var(--text-shadow);
            transition: 0.3s;
        }

        .bubble-tutor {
            align-self: flex-start;
            background: var(--white-glass);
            border-radius: 20px 20px 20px 5px;
            width: 90%;
            animation: slideInLeft 0.5s ease-out;
        }

        .tutor-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
            margin-right: 12px;
            object-fit: cover;
        }

        .tutor-name { font-weight: 600; font-size: 0.95rem; color: #fff; }

        .bubble-student {
            align-self: flex-end;
            width: 90%;
            background: var(--red-glass);
            border-radius: 20px 20px 5px 20px;
            animation: slideInRight 0.5s ease-out;
        }

        .bubble-student.listening {
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 20px rgba(194, 0, 0, 0.8);
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 1.05rem;
            resize: none;
            outline: none;
            min-height: 110px;
        }

        textarea::placeholder { color: rgba(255,255,255,0.4); }

        /* CONTROLES */
        .controls {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            border-top: 1px solid var(--border);
            z-index: 10;
        }

        .btn {
            border: none; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-mic { width: 65px; height: 65px; background: #c20000; color: white; font-size: 1.6rem; }
        .btn-check { width: 50px; height: 50px; background: #28a745; color: white; font-size: 1.2rem; }
        .btn-clear { width: 50px; height: 50px; background: #6c757d; color: white; font-size: 1.2rem; }
        
        .btn:hover { transform: scale(1.1); filter: brightness(1.2); }
        .btn:active { transform: scale(0.95); }

        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div class="lab-container">
        <div class="bubble bubble-tutor">
            <div class="tutor-header">
                <img src="https://avatars.githubusercontent.com/u/265642551?v=4" class="avatar">
                <span class="tutor-name">IA da Di 🦇</span>
            </div>
            Hello! How's your day going? Clique no microfone e fale em Inglês. Se o texto estiver correto, parabéns! Se não, você pode editar antes de clicar em verificar.
        </div>

        <div class="bubble bubble-student" id="studentBox">
            <textarea id="userInput" placeholder="Sua resposta vai aparecer aqui..."></textarea>
        </div>

        <div id="aiResponseContainer" style="width: 100%;"></div>
    </div>

    <div class="controls">
        <button class="btn btn-clear" id="btnClear" title="Limpar tudo">🗑️</button>
        <button class="btn btn-mic" id="btnMic" title="Gravar voz">🎙️</button>
        <button class="btn btn-check" id="btnCheck" title="Verificar com a IA">✨</button>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyQFufk6NphokU1ciNCD7JRKQRAVNVhB9R3xwPV9q_Ljxs_TVcYvSJRCWQSlkJh0W09/exec';
        
        const btnMic = document.getElementById('btnMic');
        const btnClear = document.getElementById('btnClear');
        const btnCheck = document.getElementById('btnCheck');
        const userInput = document.getElementById('userInput');
        const aiContainer = document.getElementById('aiResponseContainer');
        const studentBox = document.getElementById('studentBox');

        // LIMPAR TELA
        btnClear.onclick = () => {
            userInput.value = "";
            aiContainer.innerHTML = "";
        };

        // INTEGRAÇÃO REAL COM O CÉREBRO (GROQ)
        btnCheck.onclick = async () => {
            const text = userInput.value.trim();
            if (!text) return;

            // Efeito de "IA Pensando..."
            aiContainer.innerHTML = `
                <div class="bubble bubble-tutor" style="width:fit-content; margin-top:10px;">
                    <strong>...</strong>
                </div>`;

            try {
                // Enviando os dados para o seu Google Apps Script
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                const reply = data.reply || "I'm here! Could you try saying that again?";

                // Exibindo a resposta real da IA
                aiContainer.innerHTML = `
                    <div class="bubble bubble-tutor" style="margin-top:10px;">
                        <div class="tutor-header">
                            <img src="https://avatars.githubusercontent.com/u/265642551?v=4" class="avatar">
                            <span class="tutor-name">IA da Di ✨</span>
                        </div>
                        ${reply}
                    </div>`;

            } catch (error) {
                console.error("Erro na conexão:", error);
                aiContainer.innerHTML = `
                    <div class="bubble bubble-tutor" style="margin-top:10px; color: #ffbcbc;">
                        I had a small connection glitch. Please try clicking 'Verificar' again!
                    </div>`;
            }
        };

        // RECONHECIMENTO DE VOZ
        if ('webkitSpeechRecognition' in window) {
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;

            recognition.onstart = () => studentBox.classList.add('listening');
            recognition.onend = () => studentBox.classList.remove('listening');

            recognition.onresult = (e) => {
                userInput.value = e.results[0][0].transcript;
            };

            btnMic.onclick = () => recognition.start();
        } else {
            alert("Seu navegador não suporta reconhecimento de voz. Tente usar o Chrome!");
        }
    </script>
</body>
</html>
