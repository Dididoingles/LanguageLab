<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speaking Lab - Interface Fixa 🎙️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-glass: rgba(194, 0, 0, 0.4);
            --white-glass: rgba(255, 255, 255, 0.15);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: url('https://i.postimg.cc/GpBzk6PK/Windowsxp.webp') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            color: var(--text);
        }

        /* CONTAINER PRINCIPAL */
        .lab-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 20px;
            box-sizing: border-box;
        }

        /* BOLHA DO TUTOR (ESQUERDA) */
        .bubble-tutor {
            align-self: flex-start;
            max-width: 400px;
            background: var(--white-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 20px 20px 20px 5px;
            padding: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
            animation: slideInLeft 0.6s ease-out forwards;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* BOLHA DO ALUNO (DIREITA) */
        .bubble-student {
            align-self: flex-end;
            width: 100%;
            max-width: 450px;
            background: var(--red-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid transparent;
            border-radius: 20px 20px 5px 20px;
            padding: 15px;
            animation: slideInRight 0.6s ease-out forwards;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(194, 0, 0, 0.2);
        }

        /* Efeito de borda pulsante quando ativo */
        .bubble-student.listening {
            border-color: #ff4d4d;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.6);
            transform: scale(1.02);
        }

        .bubble-student textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            resize: none;
            outline: none;
            min-height: 100px;
        }

        .bubble-student textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
        }

        /* FEEDBACK E LOADING */
        #feedback-area {
            width: 100%;
            max-width: 500px;
            text-align: center;
            min-height: 40px;
        }

        .dots { display: none; font-size: 2rem; }

        /* BOTÕES FIXOS NA BASE */
        .controls {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            border-top: 1px solid var(--border);
        }

        .btn {
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-mic { width: 60px; height: 60px; background: #c20000; color: white; font-size: 1.5rem; }
        .btn-check { width: 50px; height: 50px; background: #28a745; color: white; font-size: 1.2rem; }
        .btn-clear { width: 50px; height: 50px; background: #6c757d; color: white; font-size: 1.2rem; }

        .btn:hover { transform: translateY(-3px); filter: brightness(1.2); }

        /* ANIMAÇÕES */
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        
        @media (max-width: 600px) {
            .bubble-tutor, .bubble-student { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="lab-container">
        <div class="bubble-tutor">
            <strong>IA da Di ☀️</strong><br>
            Hello! How's your day going? Clique no microfone e fale em Inglês. Se o texto for o que você falou, parabéns! Se não, você pode editar. Depois clique em verificar.
        </div>

        <div class="bubble-student" id="studentBox">
            <textarea id="userInput" placeholder="Sua resposta vai aparecer aqui..."></textarea>
        </div>

        <div id="feedback-area">
            <div class="dots" id="loading">...</div>
            <div id="aiReply"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-clear" id="btnClear" title="Limpar">🗑️</button>
        <button class="btn btn-mic" id="btnMic" title="Falar">🎙️</button>
        <button class="btn btn-check" id="btnCheck" title="Verificar">✨</button>
    </div>

    <script>
        const btnMic = document.getElementById('btnMic');
        const btnClear = document.getElementById('btnClear');
        const btnCheck = document.getElementById('btnCheck');
        const studentBox = document.getElementById('studentBox');
        const userInput = document.getElementById('userInput');
        const loading = document.getElementById('loading');
        const aiReply = document.getElementById('aiReply');

        let isRecording = false;

        // RECONHECIMENTO DE VOZ
        if ('webkitSpeechRecognition' in window) {
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;

            recognition.onstart = () => {
                isRecording = true;
                studentBox.classList.add('listening');
                btnMic.style.boxShadow = "0 0 15px #ff4d4d";
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                userInput.value = text;
            };

            recognition.onend = () => {
                isRecording = false;
                studentBox.classList.remove('listening');
                btnMic.style.boxShadow = "none";
            };

            btnMic.onclick = () => {
                if (isRecording) recognition.stop();
                else recognition.start();
            };
        }

        // BOTÃO LIMPAR
        btnClear.onclick = () => {
            userInput.value = "";
            aiReply.innerText = "";
            aiReply.parentElement.querySelector('.bubble-tutor')?.remove(); // Remove feedback anterior se houver
        };

        // BOTÃO VERIFICAR (SIMULAÇÃO)
        btnCheck.onclick = () => {
            if (!userInput.value) return;

            loading.style.display = "block";
            aiReply.innerText = "";

            // Simula o tempo de resposta da IA
            setTimeout(() => {
                loading.style.display = "none";
                const feedback = document.createElement('div');
                feedback.className = "bubble-tutor";
                feedback.style.marginTop = "10px";
                feedback.innerHTML = "<strong>IA Feedback ✨</strong><br>Great job! Your sentence is clear and grammatically correct.";
                aiReply.appendChild(feedback);
            }, 2000);
        };
    </script>
</body>
</html>
