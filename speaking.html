<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Lab - Shadowing Studio 🦇</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c20000;
            --bg: #ffffff;
            --card: #f9f9f9;
            --text: #333;
            --border: #eee;
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --text: #ffffff;
            --border: #444;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: all 0.3s ease;
        }

        .theme-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 85%;
            max-width: 350px;
            border: 1px solid var(--border);
        }

        h1 { color: var(--primary); font-size: 1.4rem; margin-bottom: 5px; }
        .subtitle { font-size: 0.8rem; opacity: 0.7; margin-bottom: 1.5rem; }

        #timer { font-size: 2.5rem; font-weight: 600; margin-bottom: 1rem; }

        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 40px;
            margin-bottom: 1.5rem;
        }
        .bar { width: 4px; height: 8px; background: var(--primary); border-radius: 4px; transition: height 0.1s ease; }

        /* Custom Audio Player */
        .player-container { display: none; margin-bottom: 1.5rem; }
        .progress-container {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 0;
            position: relative;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        .time-info { display: flex; justify-content: space-between; font-size: 0.75rem; opacity: 0.8; }

        .btn {
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-family: 'Poppins';
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }

        #recordBtn { background: var(--primary); color: white; }
        #recordBtn.recording { background: #333; animation: pulse 1.5s infinite; }
        
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; display: none; }
        #playBtn { background: var(--primary); color: white; }
        #resetBtn { background: transparent; color: var(--text); border: 1px solid var(--border); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body data-theme="dark">

<div class="theme-switch" id="themeToggle">🌓</div>

<div class="container">
    <h1 id="title">Speaking Lab 🦇</h1>
    <div class="subtitle" id="tagline">I'm Batman... and I'm listening.</div>

    <div id="timer">00:00</div>

    <div class="waveform" id="waveform">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div class="player-container" id="playerContainer">
        <div class="progress-container" id="progressArea">
            <div id="progress-bar"></div>
        </div>
        <div class="time-info">
            <span id="currentTime">00:00</span>
            <span id="totalTime">00:00</span>
        </div>
    </div>

    <div class="controls">
        <button id="recordBtn" class="btn">🎙️ Start Shadowing</button>
        <div class="action-btns" id="actionBtns">
            <button id="playBtn" class="btn">▶️ Play</button>
            <button id="resetBtn" class="btn">🗑️ Reset</button>
        </div>
    </div>
</div>

<script>
    let mediaRecorder, audioChunks = [], audioUrl, startTime, timerInterval, audioObj;
    const body = document.body;
    const themeToggle = document.getElementById('themeToggle');
    const recordBtn = document.getElementById('recordBtn');
    const actionBtns = document.getElementById('actionBtns');
    const playerContainer = document.getElementById('playerContainer');
    const progressBar = document.getElementById('progress-bar');
    const progressArea = document.getElementById('progressArea');
    const timerDisplay = document.getElementById('timer');
    const curTimeTxt = document.getElementById('currentTime');
    const totTimeTxt = document.getElementById('totalTime');
    const bars = document.querySelectorAll('.bar');

    // Troca de Tema
    themeToggle.onclick = () => {
        const current = body.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        body.setAttribute('data-theme', next);
        document.getElementById('title').innerText = next === 'dark' ? "Speaking Lab 🦇" : "Speaking Lab ☀️";
        document.getElementById('tagline').innerText = next === 'dark' ? "I'm Batman..." : "Clear as daylight.";
    };

    function formatTime(s) {
        const mins = Math.floor(s / 60).toString().padStart(2, '0');
        const secs = Math.floor(s % 60).toString().padStart(2, '0');
        return `${mins}:${secs}`;
    }

    function animateBars() {
        if (mediaRecorder?.state === "recording") {
            bars.forEach(bar => bar.style.height = (Math.random() * 30 + 5) + 'px');
            requestAnimationFrame(animateBars);
        } else { bars.forEach(bar => bar.style.height = '8px'); }
    }

    recordBtn.onclick = async () => {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/wav' });
                audioUrl = URL.createObjectURL(blob);
                audioObj = new Audio(audioUrl);
                audioObj.onloadedmetadata = () => totTimeTxt.innerText = formatTime(audioObj.duration);
                audioObj.ontimeupdate = () => {
                    const pct = (audioObj.currentTime / audioObj.duration) * 100;
                    progressBar.style.width = pct + '%';
                    curTimeTxt.innerText = formatTime(audioObj.currentTime);
                };
                audioObj.onended = () => { document.getElementById('playBtn').innerText = "▶️ Play"; progressBar.style.width = '0%'; };
                playerContainer.style.display = 'block';
                actionBtns.style.display = 'grid';
                recordBtn.style.display = 'none';
            };
            mediaRecorder.start();
            startTime = Date.now();
            timerInterval = setInterval(() => timerDisplay.innerText = formatTime((Date.now() - startTime) / 1000), 1000);
            recordBtn.classList.add('recording');
            recordBtn.innerText = "⏹️ Stop Recording";
            animateBars();
        } else {
            mediaRecorder.stop();
            clearInterval(timerInterval);
        }
    };

    document.getElementById('playBtn').onclick = function() {
        if (audioObj.paused) { audioObj.play(); this.innerText = "⏸️ Pause"; }
        else { audioObj.pause(); this.innerText = "▶️ Play"; }
    };

    progressArea.onclick = (e) => {
        const width = progressArea.clientWidth;
        const clickX = e.offsetX;
        audioObj.currentTime = (clickX / width) * audioObj.duration;
    };

    document.getElementById('resetBtn').onclick = () => {
        if(audioObj) audioObj.pause();
        playerContainer.style.display = 'none';
        actionBtns.style.display = 'none';
        recordBtn.style.display = 'flex';
        recordBtn.innerText = "🎙️ Start Shadowing";
        timerDisplay.innerText = "00:00";
        progressBar.style.width = '0%';
        bars.forEach(bar => bar.style.height = '8px');
    };
</script>
</body>
</html>
