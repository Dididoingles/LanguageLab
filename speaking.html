<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Lab - Shadowing Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c20000;
            --white: #ffffff;
            --bg: #f9f9f9;
            --text: #333;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--white);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { font-size: 0.9rem; color: #666; margin-bottom: 2rem; }

        .visualizer-container {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            margin-bottom: 2rem;
        }

        .bar {
            width: 4px;
            height: 10px;
            background: var(--primary);
            border-radius: 10px;
            transition: height 0.1s ease;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-family: 'Poppins';
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #recordBtn { background: var(--primary); color: white; }
        #recordBtn.recording { background: #333; animation: pulse 1.5s infinite; }
        
        #playBtn { background: #eee; color: #333; display: none; }
        #playBtn:hover { background: #ddd; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Speaking Lab</h1>
    <p>Pratique o Shadowing: grave sua voz e compare a pronúncia.</p>

    <div class="visualizer-container" id="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div class="controls">
        <button id="recordBtn" class="btn">
            <span id="recordIcon">🎤</span> <span id="recordText">Segurar para Gravar</span>
        </button>
        <button id="playBtn" class="btn">
            <span>▶️</span> Ouvir minha voz
        </button>
    </div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    let audioUrl;
    const recordBtn = document.getElementById('recordBtn');
    const playBtn = document.getElementById('playBtn');
    const bars = document.querySelectorAll('.bar');

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                audioUrl = URL.createObjectURL(audioBlob);
                playBtn.style.display = 'flex';
            };

            mediaRecorder.start();
            recordBtn.classList.add('recording');
            recordBtn.querySelector('#recordText').innerText = "Gravando...";
        } catch (err) {
            alert("Erro ao acessar microfone: " + err.message);
        }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            recordBtn.classList.remove('recording');
            recordBtn.querySelector('#recordText').innerText = "Segurar para Gravar";
        }
    }

    // Eventos para Mouse e Touch (Mobile)
    recordBtn.addEventListener('mousedown', startRecording);
    recordBtn.addEventListener('mouseup', stopRecording);
    recordBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
    recordBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });

    playBtn.onclick = () => {
        const audio = new Audio(audioUrl);
        audio.play();
    };
</script>

</body>
</html>
