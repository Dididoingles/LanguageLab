<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Lab - Speaking Teleprompter</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-red: #c20000;
            --success-green: #2ecc71;
            --error-red: #e74c3c;
            --glass-bg: rgba(15, 15, 15, 0.9);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('https://github.com/Dididoingles/LanguageLab/raw/c88825f499c1dc36af5b8845369ed8e925eca860/backgroundll');
            background-size: cover;
            background-position: center;
            filter: blur(15px) brightness(0.2);
            z-index: -1;
            transform: scale(1.1);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 10px 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 20px 0 10px 0;
        }

        header h1 {
            font-weight: 600;
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .fade-section {
            transition: opacity 0.6s ease, transform 0.6s ease;
            opacity: 1;
            transform: translateY(0);
        }

        .fade-out {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }

        .fade-in {
            animation: fadeIn 0.8s forwards ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #setup-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        textarea {
            width: 90%;
            max-width: 700px;
            height: 200px;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            color: rgba(255, 255, 255, 0.7);
            font-family: inherit;
            font-size: 1.1rem;
            resize: none;
            outline: none;
        }

        .square-btn {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: white;
            font-size: 2.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .square-btn:hover {
            background: var(--primary-red);
            transform: scale(1.05);
        }

        #tele-area {
            display: none;
            flex-direction: column;
            flex: 1;
            height: 100%;
            overflow: hidden;
        }

        .stats-grid {
            display: flex;
            justify-content: center;
            gap: 40px;
            background: var(--glass-bg);
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-card { display: flex; align-items: baseline; gap: 8px; }
        .stat-val { font-size: 1.2rem; font-weight: 600; color: var(--primary-red); }
        .stat-lab { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        #scroll-box {
            flex: 1;
            overflow-y: auto;
            padding: 10vh 0;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
        }

        #text-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 0 20px;
            font-size: 2.2rem;
            line-height: 1.3;
        }

        .word { color: var(--text-dim); }
        .word.done { color: var(--success-green); transition: color 0.1s; }
        .word.active { color: white; border-bottom: 3px solid var(--primary-red); }

        .footer {
            padding: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .mic-node {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .mic-node.active {
            background-color: var(--primary-red);
            color: white;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px rgba(194, 0, 0, 0.3); }
            50% { box-shadow: 0 0 15px rgba(194, 0, 0, 0.5); }
            100% { box-shadow: 0 0 5px rgba(194, 0, 0, 0.3); }
        }

        .control-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="container">
        <header>
            <h1>Speaking Training</h1>
        </header>

        <div id="setup-area" class="fade-section">
            <textarea id="raw-text" placeholder="Escreva o texto em inglês que você deseja praticar..."></textarea>
            <button class="square-btn" onclick="init()" title="Iniciar Transcrição">
                🎙️
            </button>
        </div>

        <div id="tele-area" class="fade-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-lab">Time</span>
                    <span class="stat-val" id="timer">00:00</span>
                </div>
                <div class="stat-card">
                    <span class="stat-lab">Accuracy</span>
                    <span class="stat-val" id="acc-val">0%</span>
                </div>
            </div>

            <div id="scroll-box">
                <div id="text-content"></div>
            </div>

            <div class="footer">
                <button class="control-btn" id="pause-status" onclick="togglePause()"> Pause</button>

                <div id="mic-node" class="mic-node">
                    <span style="font-size: 1.2rem;">🎧</span>
                    <small style="font-size: 0.5rem; font-weight: 600; margin-top: 2px;">Ouvindo...</small>
                </div>

                <button class="control-btn" onclick="resetApp()">Recomeçar</button>
            </div>
        </div>
    </div>

    <script>
        let recognition;
        let words = [];
        let currentIndex = 0;
        let correctCount = 0;
        let startTime;
        let timerInterval;
        let isPaused = false;

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                if (isPaused) return;
                let currentTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentTranscript += event.results[i][0].transcript.toLowerCase();
                }
                if (currentTranscript) processInput(currentTranscript);
            };

            recognition.onend = () => {
                if (!isPaused && currentIndex < words.length) {
                    try { recognition.start(); } catch(err) {}
                }
            };

            recognition.onerror = (e) => { 
                if (!isPaused && e.error !== 'no-speech') {
                    try { recognition.start(); } catch(err) {}
                }
            };
        }

        function init() {
            const input = document.getElementById('raw-text').value.trim();
            if (!input) return;

            words = input.split(/\s+/);
            const content = document.getElementById('text-content');
            content.innerHTML = words.map((w, i) => `<span class="word" id="w-${i}">${w}</span>`).join('');

            const setupArea = document.getElementById('setup-area');
            const teleArea = document.getElementById('tele-area');

            setupArea.classList.add('fade-out');

            setTimeout(() => {
                setupArea.style.display = 'none';
                teleArea.style.display = 'flex';
                teleArea.classList.remove('fade-out');
                teleArea.classList.add('fade-in');

                currentIndex = 0;
                correctCount = 0;
                startTime = Date.now();
                
                highlightCurrent();
                runTimer();
                
                document.getElementById('mic-node').classList.add('active');
                try { recognition.start(); } catch(e) {}
            }, 600);
        }

        function resetApp() {
            try { recognition.stop(); } catch(e) {}
            clearInterval(timerInterval);
            isPaused = false;

            const setupArea = document.getElementById('setup-area');
            const teleArea = document.getElementById('tele-area');

            teleArea.classList.add('fade-out');
            teleArea.classList.remove('fade-in');

            setTimeout(() => {
                teleArea.style.display = 'none';
                setupArea.style.display = 'flex';
                setupArea.classList.remove('fade-out');
                setupArea.classList.add('fade-in');

                document.getElementById('timer').innerText = "00:00";
                document.getElementById('acc-val').innerText = "0%";
                document.getElementById('mic-node').classList.remove('active');
                document.getElementById('pause-status').innerText = "⏸️ PAUSE";
            }, 600);
        }

        function processInput(transcript) {
            const spokenWords = transcript.trim().split(/\s+/);
            spokenWords.forEach(spoken => {
                if (currentIndex >= words.length) return;
                const target = words[currentIndex].toLowerCase().replace(/[.,!?;:()"]/g, "");
                const cleanedSpoken = spoken.toLowerCase().replace(/[.,!?;:()"]/g, "");

                if (cleanedSpoken === target) {
                    const el = document.getElementById(`w-${currentIndex}`);
                    if (el && !el.classList.contains('done')) {
                        el.classList.add('done');
                        correctCount++;
                        currentIndex++;
                        updateAccuracy();
                        highlightCurrent();
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            });
            if (currentIndex >= words.length) finish();
        }

        function highlightCurrent() {
            document.querySelectorAll('.word').forEach(w => w.classList.remove('active'));
            const active = document.getElementById(`w-${currentIndex}`);
            if (active) active.classList.add('active');
        }

        function updateAccuracy() {
            const pct = Math.round((correctCount / words.length) * 100);
            document.getElementById('acc-val').innerText = pct + '%';
        }

        function runTimer() {
            timerInterval = setInterval(() => {
                const diff = Math.floor((Date.now() - startTime) / 1000);
                const m = Math.floor(diff / 60).toString().padStart(2, '0');
                const s = (diff % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('pause-status');
            const mic = document.getElementById('mic-node');
            
            if (isPaused) {
                btn.innerText = 'Continuar';
                mic.classList.remove('active');
                recognition.stop();
                clearInterval(timerInterval);
            } else {
                btn.innerText = 'Pause';
                mic.classList.add('active');
                startTime = Date.now() - (parseTimer());
                runTimer();
                try { recognition.start(); } catch(e) {}
            }
        }

        function parseTimer() {
            const parts = document.getElementById('timer').innerText.split(':');
            return (parseInt(parts[0]) * 60 + parseInt(parts[1])) * 1000;
        }

        function finish() {
            try { recognition.stop(); } catch(e) {}
            clearInterval(timerInterval);
            document.getElementById('mic-node').classList.remove('active');
        }
    </script>
</body>
</html>
